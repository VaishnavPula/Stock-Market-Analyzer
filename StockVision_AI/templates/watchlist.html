{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><div class="eyebrow">PERSONAL COLLECTION</div><h1>Your watchlist</h1><p>Keep your favorite tickers in one place.</p></div></div><section class="card"><form method="post" action="/watchlist/add" class="toolbar"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="symbol" placeholder="Ticker or company name" required><button class="button">+ Add stock</button></form></section><section class="card"><h2>Saved symbols</h2>{% for item in items %}<div class="watchrow"><a href="{{url_for('stock',symbol=item.stock_symbol)}}">{{item.stock_symbol}} ↗</a><form method="post" action="/watchlist/remove"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="id" value="{{item.id}}"><button class="button secondary">Remove</button></form></div>{% else %}<p>No stocks saved yet.</p>{% endfor %}</section>{% endblock %}
